<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poplist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef2f8;
    --bg-2:#e2e8f4;
    --ink:#2b3145;
    --ink-soft:#6b7288;
    --ink-faint:#9aa0b4;
    --card:#ffffff;
    --line:#dfe4f0;
    --danger:#d06a72;
    --ok:#4fa88a;
    --accent:#5b8def;
    --accent-soft:rgba(91,141,239,.12);
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;height:100dvh;}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 15% -10%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(120% 90% at 100% 0%, var(--accent-soft) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(160deg,var(--bg-1),var(--bg-2));
    background-attachment:fixed;
    min-height:100%;
    transition:--accent .4s;
  }
  .wrap{
    max-width:640px;margin:0 auto;padding:22px 16px 120px;
    min-height:100%;min-height:100dvh;
  }
  /* Header */
  header{margin-bottom:18px;}
  .brand{
    font-family:"Nunito",system-ui,sans-serif;
    font-weight:800;font-size:1.9rem;letter-spacing:-.02em;
    display:flex;align-items:center;gap:10px;line-height:1;
  }
  .brand .dot{
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#fff 0%,var(--accent) 60%,color-mix(in srgb,var(--accent) 60%,#000) 100%);
    box-shadow:0 0 0 4px var(--accent-soft), 0 4px 10px rgba(0,0,0,.12);
    flex:none;
  }
  .tagline{color:var(--ink-soft);font-size:.9rem;margin:6px 0 0 26px;}
  .today{color:var(--ink-faint);font-size:.82rem;margin:2px 0 0 26px;letter-spacing:.01em;}
  /* Notices */
  .notice{
    display:flex;gap:10px;align-items:flex-start;
    border-radius:14px;padding:12px 14px;margin:0 0 14px;
    font-size:.86rem;line-height:1.4;
  }
  .notice b{font-family:"Nunito",sans-serif;font-weight:800;display:block;margin-bottom:2px;}
  .notice.bad{background:rgba(208,106,114,.1);border:1px solid rgba(208,106,114,.35);color:#8a3b42;}
  .notice.good{background:rgba(79,168,138,.11);border:1px solid rgba(79,168,138,.35);color:#2f6b57;}
  .notice .x{
    margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;
    opacity:.55;font-size:1.1rem;line-height:1;padding:2px 4px;
  }
  .notice .x:hover{opacity:1;}
  /* Tabs */
  .tabs{
    display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;
    scrollbar-width:none;-ms-overflow-style:none;margin:0 -2px 6px;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.6);
    color:var(--ink-soft);font-family:"Nunito",sans-serif;font-weight:700;
    font-size:.9rem;padding:9px 15px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    min-height:42px;transition:background .18s,color .18s,border-color .18s,transform .1s;
  }
  .tab:hover{background:#fff;}
  .tab:active{transform:scale(.97);}
  .tab .tick{width:9px;height:9px;border-radius:50%;background:var(--tab-c);opacity:.55;}
  .tab.on{background:#fff;color:var(--ink);border-color:transparent;
    box-shadow:0 4px 14px rgba(40,50,80,.1), inset 0 0 0 1.5px var(--tab-c);}
  .tab.on .tick{opacity:1;}
  .tab .cnt{font-size:.78rem;color:var(--ink-faint);font-weight:700;min-width:14px;text-align:center;}
  .tab.on .cnt{color:var(--tab-c);}
  .tab.tab-add{
    border-style:dashed;color:var(--ink-faint);font-size:1.05rem;font-weight:800;
  }
  .tab.tab-add:hover{color:var(--ink);border-color:var(--ink-faint);background:rgba(255,255,255,.6);}
  /* Toggle row: one control shows/hides both the working-days picker and the add row */
  .ctrl-toggles{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    margin:0 0 10px;font-size:.8rem;color:var(--ink-soft);
  }
  .add-toggle{
    display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
    color:var(--ink-soft);font:inherit;font-weight:600;padding:2px;
  }
  .add-toggle:hover{color:var(--ink);}
  .chev{display:inline-block;font-size:.68rem;color:var(--ink-faint);transition:transform .15s;}
  .add-toggle.open .chev{transform:rotate(90deg);}
  .gs-days{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;}
  .gs-days.open{display:flex;}
  .gs-day{
    border:1px solid var(--line);background:#fff;color:var(--ink-faint);
    border-radius:999px;width:34px;height:30px;font-size:.78rem;font-weight:700;
    font-family:"Nunito",sans-serif;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  .gs-day.on{background:var(--accent);color:#fff;border-color:transparent;}
  /* Add row */
  .add{
    display:none;gap:8px;margin:0 0 18px;
  }
  .add.open{display:flex;}
  .add input{
    flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:14px;
    padding:14px 16px;font-size:1rem;font-family:inherit;color:var(--ink);
    min-height:50px;box-shadow:0 2px 8px rgba(40,50,80,.04);outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  .add input::placeholder{color:var(--ink-faint);}
  .add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .add button{
    flex:none;border:none;background:var(--accent);color:#fff;border-radius:14px;
    padding:0 18px;font-family:"Nunito",sans-serif;font-weight:800;font-size:1rem;
    cursor:pointer;min-height:50px;transition:transform .1s,filter .18s;
  }
  .add button:hover{filter:brightness(1.05);}
  .add button:active{transform:scale(.96);}
  /* List */
  .list{display:flex;flex-direction:column;gap:10px;position:relative;}
  .bubble{
    position:relative;display:flex;align-items:stretch;gap:2px;
    background:linear-gradient(145deg,#ffffff 0%,#fbfcff 100%);
    border:1px solid var(--line);border-radius:20px;
    box-shadow:0 4px 16px rgba(45,55,85,.07);
    overflow:hidden;will-change:transform;
    transition:box-shadow .2s,transform .18s ease;
  }
  .bubble::before{
    /* soap-bubble sheen highlight */
    content:"";position:absolute;top:-40%;left:-10%;width:60%;height:120%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .bubble::after{
    /* faint tab-tinted iridescence at the tail */
    content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;
    background:radial-gradient(circle,var(--tab-c) 0%,rgba(255,255,255,0) 70%);
    opacity:.10;pointer-events:none;
  }
  .bubble.dragging{
    box-shadow:0 16px 34px rgba(45,55,85,.22);z-index:20;transition:none;
    border-color:var(--tab-c);
  }
  .rank{
    flex:none;width:38px;display:flex;align-items:center;justify-content:center;
    font-family:"Nunito",sans-serif;font-weight:800;font-size:.95rem;
    color:var(--tab-c);opacity:.85;position:relative;z-index:1;
  }
  .body{
    flex:1;min-width:0;padding:15px 6px 15px 0;font-size:1rem;line-height:1.35;
    color:var(--ink);word-break:break-word;position:relative;z-index:1;
    display:flex;align-items:center;
  }
  /* Goal bubble contents */
  .bubble.goal .body{flex-direction:column;align-items:stretch;padding:11px 10px 11px 0;gap:4px;}
  .goal-top{display:flex;align-items:center;gap:8px;}
  .goal-unit{flex:1;min-width:0;font-weight:700;font-size:.95rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .goal-edit{
    flex:none;border:none;background:none;cursor:pointer;color:var(--ink-faint);
    font-size:.9rem;padding:2px 4px;line-height:1;
  }
  .goal-edit:hover{color:var(--tab-c);}
  .goal-pace-wrap{text-align:center;padding:2px 0;}
  .goal-pace-num{font-family:"Nunito",sans-serif;font-weight:800;font-size:1.3rem;color:var(--tab-c);}
  .goal-pace-cap{
    font-family:"Nunito",sans-serif;font-weight:700;font-size:.8rem;
    text-transform:none;color:var(--ink-faint);margin-left:5px;
  }
  .goal-done{font-family:"Nunito",sans-serif;font-weight:800;color:var(--ok);font-size:1.1rem;text-align:center;padding:6px 0;}
  .goal-stats{font-size:.82rem;color:var(--ink-faint);text-align:center;}
  .goal-stats b{color:var(--ink);font-weight:800;}
  .goal-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:2px 0;}
  .goal-fill{height:100%;background:var(--tab-c);border-radius:999px;transition:width .25s;}
  .goal-current-row{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-soft);justify-content:center;}
  .goal-cur-btn{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:3px 10px;font-family:"Nunito",sans-serif;font-weight:800;color:var(--ink);
    cursor:pointer;font-size:.86rem;
  }
  .goal-cur-btn:hover{border-color:var(--tab-c);color:var(--tab-c);}
  .goal-cur-input{
    width:90px;border:1px solid var(--tab-c);border-radius:10px;padding:3px 8px;
    font-family:inherit;font-size:.86rem;font-weight:700;color:var(--ink);
  }
  .handle{
    flex:none;width:42px;display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;color:var(--ink-faint);position:relative;z-index:1;
    align-self:stretch;
  }
  .handle:active{cursor:grabbing;}
  .handle svg{width:18px;height:18px;}
  .pop{
    flex:none;width:52px;align-self:stretch;border:none;background:transparent;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;color:var(--ink-faint);
    transition:color .18s,background .18s;
  }
  .pop:hover{color:var(--ok);background:rgba(79,168,138,.08);}
  .pop .ring{
    width:24px;height:24px;border-radius:50%;border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center;transition:transform .1s;
  }
  .pop:active .ring{transform:scale(.85);}
  .bubble.popping{animation:pop .42s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes pop{
    0%{transform:scale(1);opacity:1;}
    35%{transform:scale(1.06);}
    100%{transform:scale(.4);opacity:0;height:0;margin-top:-12px;}
  }
  .spark{
    position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;
    z-index:30;opacity:.9;
  }
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}}
  /* Empty state */
  .empty{
    text-align:center;padding:46px 20px;color:var(--ink-soft);
  }
  .empty .big{
    font-family:"Nunito",sans-serif;font-weight:800;font-size:1.15rem;color:var(--ink);margin-bottom:6px;
  }
  .empty .em{font-size:2rem;margin-bottom:10px;opacity:.5;}
  /* Footer actions */
  .foot{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(to top,var(--bg-2) 60%,rgba(226,232,244,0));
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .foot-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;}
  .btn{
    border:none;border-radius:14px;font-family:"Nunito",sans-serif;font-weight:800;
    font-size:.95rem;cursor:pointer;min-height:50px;padding:0 18px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .18s,background .18s;
  }
  .btn:active{transform:scale(.97);}
  .btn-day{flex:1;background:var(--accent);color:#fff;box-shadow:0 6px 18px var(--accent-soft);}
  .btn-day:hover{filter:brightness(1.05);}
  .btn-log{flex:none;background:#fff;color:var(--ink-soft);border:1px solid var(--line);padding:0 14px;}
  .btn-icon{flex:none;width:48px;min-height:48px;padding:0;font-size:1.15rem;}
  .btn-log:hover{color:var(--ink);}
  .btn-log .badge{
    background:var(--accent-soft);color:var(--accent);border-radius:999px;
    font-size:.72rem;padding:2px 7px;font-weight:800;
  }
  /* Overlay (review + log + goal history + manage tabs) */
  .scrim{
    position:fixed;inset:0;background:rgba(30,36,54,.42);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:100;
  }
  .scrim.show{display:flex;}
  .sheet{
    background:#fff;border-radius:24px;max-width:460px;width:100%;
    max-height:86vh;max-height:86dvh;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 70px rgba(20,26,44,.4);
    animation:rise .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{
    padding:20px 22px 12px;
  }
  .sheet-head h2{
    font-family:"Nunito",sans-serif;font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em;
  }
  .sheet-head p{margin:5px 0 0;color:var(--ink-soft);font-size:.88rem;}
  .review-card{
    margin:8px 22px 4px;padding:20px 18px;border-radius:18px;
    background:linear-gradient(145deg,#fff,#f7f9ff);border:1.5px solid var(--tab-c);
    box-shadow:0 6px 20px rgba(45,55,85,.08);
  }
  .review-card .task{font-size:1.12rem;line-height:1.35;color:var(--ink);font-weight:500;}
  .review-actions{display:flex;flex-direction:column;gap:9px;padding:14px 22px 8px;}
  .ra{
    border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 16px;
    font-family:"Nunito",sans-serif;font-weight:700;font-size:.98rem;cursor:pointer;
    text-align:left;display:flex;align-items:center;gap:12px;min-height:50px;
    transition:transform .1s,border-color .18s,background .18s;color:var(--ink);
  }
  .ra:active{transform:scale(.98);}
  .ra .ic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;}
  .ra small{display:block;font-family:"Inter",sans-serif;font-weight:400;font-size:.78rem;color:var(--ink-faint);margin-top:1px;}
  .ra.keep:hover{border-color:var(--ok);background:rgba(79,168,138,.06);}
  .ra.keep .ic{color:var(--ok);}
  .ra.drop:hover{border-color:var(--ink-faint);background:#f6f7fa;}
  .ra.drop .ic{color:var(--ink-faint);}
  .ra.deleg:hover{border-color:#e0a23c;background:rgba(224,162,60,.07);}
  .ra.deleg .ic{color:#e0a23c;}
  .review-progress{padding:6px 22px 18px;color:var(--ink-faint);font-size:.8rem;text-align:center;}
  /* Log list */
  .log-body{overflow-y:auto;padding:6px 22px 4px;}
  .log-item{
    padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;
  }
  .log-item:last-child{border-bottom:none;}
  .log-item .lt{flex:1;font-size:.95rem;color:var(--ink);line-height:1.3;}
  .log-item .lm{font-size:.76rem;color:var(--ink-faint);margin-top:3px;}
  .log-item .pill{
    flex:none;font-size:.7rem;font-weight:700;font-family:"Nunito",sans-serif;
    padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;
  }
  .sheet-foot{padding:12px 22px 20px;display:flex;gap:10px;}
  .sheet-foot .btn{flex:1;}
  .btn-ghost{background:#f4f6fa;color:var(--ink-soft);}
  .btn-ghost:hover{background:#eceff5;color:var(--ink);}
  .btn-solid{background:var(--accent);color:#fff;}
  .log-empty{padding:34px 10px;text-align:center;color:var(--ink-soft);}
  /* Manage tabs */
  .manage-row{
    display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .manage-row:last-of-type{border-bottom:none;}
  .mr-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .mr-actions{display:flex;align-items:center;flex:none;}
  .mr-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .mr-label{flex:1;min-width:0;font-weight:600;font-size:.92rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mr-type{flex:none;font-size:.7rem;font-weight:700;color:var(--ink-faint);background:#f4f6fa;border-radius:999px;padding:2px 8px;}
  .mr-btn{
    flex:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;
    font-size:1rem;width:34px;height:34px;border-radius:8px;
  }
  .mr-btn:hover{background:#f4f6fa;color:var(--ink);}
  .mr-btn:disabled{opacity:.3;cursor:default;}
  .mr-btn:disabled:hover{background:none;}
  /* Narrow screens: five fixed-width buttons alongside dot+label+type badge
     leaves almost nothing for the tab name, truncating it unreadably. Stack
     the name above its action row instead of squeezing everything onto one
     line. */
  @media (max-width:420px){
    .manage-row{flex-direction:column;align-items:stretch;gap:6px;}
    .mr-actions{justify-content:flex-end;}
  }
  .mr-danger:hover{background:rgba(208,106,114,.12);color:var(--danger);}
  .manage-add{padding-top:14px;display:flex;flex-direction:column;gap:8px;}
  .manage-add input{
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.92rem;
    font-family:inherit;color:var(--ink);outline:none;
  }
  .manage-add input:focus{border-color:var(--accent);}
  .manage-add-type{display:flex;gap:8px;}
  .mat-opt{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;
    font-family:"Nunito",sans-serif;font-weight:700;font-size:.85rem;color:var(--ink-soft);cursor:pointer;
  }
  .mat-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  /* Work hours sheet */
  .hours-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
  .hours-row:last-child{border-bottom:none;}
  .hours-day-toggle{
    flex:none;width:56px;border:1px solid var(--line);background:#fff;color:var(--ink-faint);
    border-radius:10px;padding:7px 0;font-family:"Nunito",sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;
  }
  .hours-day-toggle.on{background:var(--accent);color:#fff;border-color:transparent;}
  .hours-time{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px 8px;
    font-family:inherit;font-size:.85rem;color:var(--ink);
  }
  .hours-time:disabled{opacity:.4;}
  .hours-sep{color:var(--ink-faint);flex:none;}
  /* Task-attached daily goal */
  .task-body{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .task-text{flex:1;min-width:0;}
  .task-goal-add{
    flex:none;border:none;background:none;cursor:pointer;color:var(--ink-faint);
    opacity:.35;font-size:.95rem;padding:2px 4px;line-height:1;
  }
  .task-goal-add:hover{opacity:1;color:var(--tab-c);}
  .bubble.has-daily-goal .body{flex-direction:column;align-items:stretch;padding:11px 10px 11px 0;gap:4px;}
  .task-goal-text{font-size:1rem;line-height:1.35;color:var(--ink);word-break:break-word;}
  .daily-stats{font-size:.82rem;color:var(--ink-faint);text-align:center;}
  .daily-stats b{color:var(--ink);font-weight:800;}
  .daily-pace-row{font-size:.86rem;color:var(--ink-soft);text-align:center;}
  .daily-pace-row b{color:var(--tab-c);font-weight:800;font-family:"Nunito",sans-serif;}
  .daily-pace-note{font-size:.8rem;color:var(--ink-faint);text-align:center;font-style:italic;}
  .daily-done{font-family:"Nunito",sans-serif;font-weight:800;color:var(--ok);font-size:1rem;text-align:center;padding:4px 0;}
  .daily-goal-edit{flex:none;border:none;background:none;cursor:pointer;color:var(--ink-faint);font-size:.85rem;padding:2px 4px;}
  .daily-goal-edit:hover{color:var(--tab-c);}
  @media (max-width:420px){
    .brand{font-size:1.7rem;}
    .wrap{padding-top:16px;}
  }
  /* Compact mode: very short viewports (a phone's small cover display when
     folded, or a browser toolbar eating most of the visible height) leave
     little room between the header and the fixed footer. Tighten vertical
     spacing so the list keeps some breathing room instead of being squeezed
     to nothing. */
  @media (max-height:560px){
    .wrap{padding:12px 16px 108px;}
    header{margin-bottom:10px;}
    .brand{font-size:1.4rem;}
    .brand .dot{width:13px;height:13px;}
    .tagline{display:none;}
    .today{margin-top:2px;}
    .tabs{padding:2px 2px 6px;margin-bottom:2px;}
    .tab{min-height:38px;padding:7px 13px;}
    .foot{padding:8px 16px calc(10px + env(safe-area-inset-bottom));}
    .btn,.btn-icon{min-height:42px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.05ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Poplist</div>
    <div class="tagline">Pop it when it's done.</div>
    <div class="today" id="today"></div>
  </header>

  <div id="warn"></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="ctrl-toggles" id="ctrlToggles">
    <button type="button" class="add-toggle open" id="addToggle">
      <span class="chev">▸</span><span id="addToggleLabel">Add a task</span>
    </button>
  </div>
  <div class="gs-days" id="gsDays"></div>
  <div class="add open" id="addRow">
    <input id="taskInput" type="text" placeholder="Add a task…" autocomplete="off" enterkeyhint="done">
    <button id="addBtn">Add</button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="foot">
  <div class="foot-inner">
    <button class="btn btn-day" id="newDayBtn">Start a new day</button>
    <button class="btn btn-log" id="logBtn">Delegated <span class="badge" id="logCount">0</span></button>
    <button class="btn btn-log btn-icon" id="exportBtn" title="Save a backup file">⭳</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="btn btn-log btn-icon" id="importBtn" title="Load a backup file">⭱</button>
  </div>
</div>

<!-- Review overlay -->
<div class="scrim" id="reviewScrim">
  <div class="sheet" id="reviewSheet"></div>
</div>

<!-- Log overlay -->
<div class="scrim" id="logScrim">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Delegated log</h2>
      <p>Tasks you handed off, kept for the record.</p>
    </div>
    <div class="log-body" id="logBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="logClear">Clear log</button>
      <button class="btn btn-solid" id="logClose">Done</button>
    </div>
  </div>
</div>

<!-- Goal history overlay -->
<div class="scrim" id="goalHistScrim">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="goalHistTitle">Goal history</h2>
      <p>Past months' quotas, kept for the record.</p>
    </div>
    <div class="log-body" id="goalHistBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="goalHistClear">Clear history</button>
      <button class="btn btn-solid" id="goalHistClose">Done</button>
    </div>
  </div>
</div>

<!-- Manage tabs overlay -->
<div class="scrim" id="manageScrim">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Manage tabs</h2>
      <p>Add, rename, reorder, or remove tabs.</p>
    </div>
    <div class="log-body" id="manageBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="openHoursBtn">Work hours</button>
      <button class="btn btn-solid" id="manageClose">Done</button>
    </div>
  </div>
</div>

<!-- Work hours overlay -->
<div class="scrim" id="hoursScrim">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Work hours</h2>
      <p>Set your office hours per day — used to pace daily goals on your to-dos.</p>
    </div>
    <div class="log-body" id="hoursBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-solid" id="hoursClose">Done</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  const STORE_KEY = "poplist:v1";
  const BACKUP_KEY = "poplist:v1:backup";
  const DAY_START_HOUR = 5; // a "day" rolls over at 5am, not midnight
  const DEFAULT_WORK_DAYS = [2,3,4,5,6]; // Tue-Sat; Sun(0)/Mon(1) off by default
  const PALETTE = ["#2fa9a4","#c76fa0","#5b8def","#5aa87c","#a07bd4","#e0a23c","#d16a6a","#6d9dc5"];

  // Office hours per weekday (0=Sun..6=Sat), used to pace daily goals attached
  // to to-dos. A day with no entry is treated as not a work day.
  function defaultWorkHours(){
    const o={};
    [1,2,3,4,5].forEach(d=>{ o[d]={start:"09:00",end:"17:00"}; });
    return o;
  }
  const TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
  function normalizeWorkHours(wh){
    if(!wh || typeof wh!=="object") return defaultWorkHours();
    const out={};
    for(let d=0; d<7; d++){
      const e=wh[d];
      if(e && typeof e==="object" && TIME_RE.test(e.start) && TIME_RE.test(e.end)) out[d]={start:e.start,end:e.end};
    }
    return out;
  }

  function makeDefaultTabList(){
    return [
      {id:"work-goals", label:"Work Goals", color:"#2fa9a4", type:"goal", workDays:DEFAULT_WORK_DAYS.slice()},
      {id:"home-goals", label:"Home Goals", color:"#c76fa0", type:"goal", workDays:DEFAULT_WORK_DAYS.slice()},
      {id:"work",       label:"Work",       color:"#5b8def", type:"task"},
      {id:"home",       label:"Home",       color:"#5aa87c", type:"task"},
      {id:"book",       label:"Book",       color:"#a07bd4", type:"task"}
    ];
  }

  let state = { tabList: makeDefaultTabList(), tabs:{}, delegated:[], goalHistory:[], workHours: defaultWorkHours(), active:"work-goals" };
  state.tabList.forEach(t=>{ state.tabs[t.id]=[]; });

  let storageOK = null;   // null = unknown, true/false once verified
  let lastSnapshot = null; // pre-review state, for undo

  /* ---------- storage ---------- */
  // localStorage is the primary store — it's a standard, always-available
  // browser feature, so it works the same whether this is opened as a
  // hosted page or inside Claude. window.storage (Claude's artifact bridge)
  // is tried too, when present, as a bonus second copy.
  const mem = {};
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return undefined; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

  const store = {
    async get(k){
      const local=lsGet(k);
      if(local!==null && local!==undefined) return local;
      if(window.storage&&window.storage.get){
        try{
          const r=await window.storage.get(k,false);
          if(r&&typeof r.value!=="undefined") return r.value;
        }catch(e){}
        try{
          const r=await window.storage.get(k);
          if(r&&typeof r.value!=="undefined") return r.value;
        }catch(e){}
      }
      return (k in mem)?mem[k]:null;
    },
    async set(k,v){
      mem[k]=v;
      const localOK=lsSet(k,v);
      let bridgeOK=false;
      if(window.storage&&window.storage.set){
        try{ bridgeOK=!!(await window.storage.set(k,v,false)); }catch(e){}
        if(!bridgeOK){ try{ bridgeOK=!!(await window.storage.set(k,v)); }catch(e){} }
      }
      return localOK||bridgeOK;
    }
  };

  function waitForStorage(ms){
    return new Promise(res=>{
      const t0=Date.now();
      (function poll(){
        if(window.storage&&window.storage.set&&window.storage.get) return res(true);
        if(Date.now()-t0>ms) return res(false);
        setTimeout(poll,80);
      })();
    });
  }

  async function verifyStorage(){
    const probe="poplist:probe", val="ok:"+Date.now();
    if(lsSet(probe,val) && lsGet(probe)===val){ storageOK=true; return; }
    // localStorage unavailable (rare: private mode with storage fully blocked) —
    // fall back to checking Claude's bridge before giving up.
    const present=await waitForStorage(2500);
    if(!present){ storageOK=false; return; }
    try{
      await window.storage.set(probe,val,false);
      const r=await window.storage.get(probe,false);
      storageOK = (r&&r.value===val);
    }catch(e){ storageOK=false; }
  }

  let saveTimer=null, saving=false;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(doSave,120);
  }
  async function doSave(){
    if(saving) return;
    saving=true;
    const ok=await store.set(STORE_KEY, JSON.stringify(state));
    saving=false;
    if(ok && storageOK===false){ storageOK=true; renderWarn(); }      // recovered
    else if(!ok && storageOK!==false){ storageOK=false; renderWarn(); } // just failed
  }
  // Flush synchronously-ish on the way out, so nothing typed is lost.
  window.addEventListener("pagehide",()=>{ clearTimeout(saveTimer); doSave(); });
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ clearTimeout(saveTimer); doSave(); }
  });

  /* ---------- state shape / migration ----------
     v2 shape: { tabList:[{id,label,color,type,workDays?}], tabs:{[id]:[]}, delegated:[], goalHistory:[], active }
     v1 shape (pre-custom-tabs): { tabs:{followup,work,home,buy,goals}, workDays:[...], delegated:[], goalHistory:[], active }
  */
  const OLD_TAB_LABELS = {followup:"Customer Follow-up", work:"Work", home:"Home", buy:"Purchases", goals:"Work Goals"};

  function normalizeTab(t,i){
    const id = (t&&t.id!=null) ? String(t.id) : ("t"+i+uid());
    const type = (t&&t.type==="goal") ? "goal" : "task";
    const out = {
      id,
      label: (t&&typeof t.label==="string"&&t.label.trim()) ? t.label.trim() : "Untitled",
      color: (t&&typeof t.color==="string"&&t.color) ? t.color : PALETTE[i%PALETTE.length],
      type
    };
    if(type==="goal") out.workDays = (t&&Array.isArray(t.workDays)&&t.workDays.length) ? t.workDays.slice() : DEFAULT_WORK_DAYS.slice();
    return out;
  }

  function migrateLegacy(raw){
    const rt = raw.tabs||{};
    const tabList = makeDefaultTabList();
    const tabs = {
      "work-goals": Array.isArray(rt.goals) ? rt.goals.slice() : [],
      "home-goals": [],
      "work": Array.isArray(rt.work) ? rt.work.slice() : [],
      "home": Array.isArray(rt.home) ? rt.home.slice() : [],
      "book": []
    };
    tabList[0].workDays = (Array.isArray(raw.workDays)&&raw.workDays.length) ? raw.workDays.slice() : DEFAULT_WORK_DAYS.slice();
    const activeMap = {goals:"work-goals", work:"work", home:"home"};
    const active = activeMap[raw.active] || "work-goals";
    const delegated = (Array.isArray(raw.delegated)?raw.delegated:[]).map(d=>Object.assign({},d,{
      tabLabel: d.tabLabel || OLD_TAB_LABELS[d.tab] || d.tab
    }));
    const goalHistory = (Array.isArray(raw.goalHistory)?raw.goalHistory:[]).map(h=>Object.assign({},h,{
      tabId: h.tabId||"work-goals", tabLabel: h.tabLabel||"Work Goals"
    }));
    return {tabList, tabs, active, delegated, goalHistory};
  }

  function buildStateFrom(p){
    if(!p || (!p.tabs && !p.tabList)) return null;
    const norm = Array.isArray(p.tabList) ? p : migrateLegacy(p);
    const tabList = (Array.isArray(norm.tabList)&&norm.tabList.length ? norm.tabList : makeDefaultTabList()).map(normalizeTab);
    const tabs = {};
    tabList.forEach(t=>{ tabs[t.id] = Array.isArray((norm.tabs||{})[t.id]) ? norm.tabs[t.id].slice() : []; });
    return {
      tabList, tabs,
      delegated: Array.isArray(norm.delegated) ? norm.delegated : [],
      goalHistory: Array.isArray(norm.goalHistory) ? norm.goalHistory : [],
      workHours: normalizeWorkHours(norm.workHours),
      active: tabList.some(t=>t.id===norm.active) ? norm.active : tabList[0].id
    };
  }
  function applyState(s){
    state.tabList=s.tabList; state.tabs=s.tabs; state.delegated=s.delegated;
    state.goalHistory=s.goalHistory; state.workHours=s.workHours; state.active=s.active;
  }
  function hydrate(p){
    const s=buildStateFrom(p);
    if(!s) return false;
    applyState(s);
    return true;
  }
  function isEmpty(s){ return s.tabList.every(t=>!(s.tabs[t.id]||[]).length); }

  async function load(){
    let loaded=false;
    const raw=await store.get(STORE_KEY);
    if(raw){ try{ loaded=hydrate(JSON.parse(raw)); }catch(e){} }
    // If the main record is missing or came back empty, fall back to the backup
    // rather than silently showing a blank board.
    if(!loaded || isEmpty(state)){
      const braw=await store.get(BACKUP_KEY);
      if(braw){
        try{
          const b=JSON.parse(braw);
          const s=buildStateFrom(b);
          if(s && !isEmpty(s)){ applyState(s); recovered=true; }
        }catch(e){}
      }
    }
  }
  let recovered=false;

  // Rolling backup so a bad write can never be the only copy.
  async function backup(){ await store.set(BACKUP_KEY, JSON.stringify(state)); }

  /* ---------- helpers ---------- */
  const $=s=>document.querySelector(s);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function tabById(id){ return state.tabList.find(t=>t.id===id); }
  function activeTab(){ return tabById(state.active) || state.tabList[0]; }
  function tabColor(id){ const t=tabById(id); return t?t.color:"#8a90a6"; }
  function tabLabel(id){ const t=tabById(id); return t?t.label:"(removed)"; }
  function fmtDate(ts){
    const d=new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+
           d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }
  function applyAccent(){
    const c=tabColor(state.active);
    document.documentElement.style.setProperty("--accent",c);
    const soft=hexA(c,.13);
    document.documentElement.style.setProperty("--accent-soft",soft);
  }
  function hexA(hex,a){
    const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  /* ---------- render ---------- */
  const listEl=$("#list");
  const tabsEl=$("#tabs");
  const manageScrim=$("#manageScrim");

  function renderTabs(){
    tabsEl.innerHTML="";
    state.tabList.forEach(t=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="tab"+(t.id===state.active?" on":"");
      b.style.setProperty("--tab-c",t.color);
      b.innerHTML=`<span class="tick"></span>${escapeHtml(t.label)}<span class="cnt">${(state.tabs[t.id]||[]).length}</span>`;
      b.onclick=()=>{
        state.active=t.id; applyAccent(); renderTabs(); renderList();
        renderGoalSettings(); updateFooter(); updatePlaceholder(); save();
      };
      tabsEl.appendChild(b);
    });
    const addBtn=document.createElement("button");
    addBtn.type="button";
    addBtn.className="tab tab-add";
    addBtn.title="Manage tabs";
    addBtn.setAttribute("aria-label","Manage tabs");
    addBtn.textContent="+";
    addBtn.onclick=()=>{ renderManageBody(); manageScrim.classList.add("show"); };
    tabsEl.appendChild(addBtn);
  }

  /* ---------- Manage tabs ---------- */
  let newTabType="task";
  function renderManageBody(){
    const body=$("#manageBody");
    const rows=state.tabList.map((t,i)=>`
      <div class="manage-row" data-id="${t.id}">
        <div class="mr-main">
          <span class="mr-dot" style="background:${t.color}"></span>
          <span class="mr-label">${escapeHtml(t.label)}</span>
          <span class="mr-type">${t.type==="goal"?"Goal":"Task"}</span>
        </div>
        <div class="mr-actions">
          <button type="button" class="mr-btn" data-act="up" ${i===0?"disabled":""} aria-label="Move up">↑</button>
          <button type="button" class="mr-btn" data-act="down" ${i===state.tabList.length-1?"disabled":""} aria-label="Move down">↓</button>
          <button type="button" class="mr-btn" data-act="rename" aria-label="Rename">✎</button>
          <button type="button" class="mr-btn mr-danger" data-act="delete" aria-label="Delete">🗑</button>
        </div>
      </div>`).join("");
    newTabType="task";
    body.innerHTML = rows + `
      <div class="manage-add">
        <input type="text" id="newTabName" placeholder="New tab name…" maxlength="40">
        <div class="manage-add-type">
          <button type="button" class="mat-opt on" id="matTask">Task</button>
          <button type="button" class="mat-opt" id="matGoal">Goal</button>
        </div>
        <button type="button" class="btn btn-solid" id="addTabBtn" style="min-height:44px;">Add tab</button>
      </div>`;
    body.querySelectorAll(".manage-row").forEach(row=>{
      const id=row.dataset.id;
      row.querySelectorAll(".mr-btn").forEach(b=>{
        b.onclick=()=>handleManageAction(id,b.dataset.act);
      });
    });
    const matTask=$("#matTask"), matGoal=$("#matGoal");
    matTask.onclick=()=>{ newTabType="task"; matTask.classList.add("on"); matGoal.classList.remove("on"); };
    matGoal.onclick=()=>{ newTabType="goal"; matGoal.classList.add("on"); matTask.classList.remove("on"); };
    $("#addTabBtn").onclick=()=>{
      const nameInp=$("#newTabName");
      const name=nameInp.value.trim();
      if(!name){ nameInp.focus(); return; }
      addTab(name,newTabType);
      renderManageBody();
    };
  }
  function addTab(name,type){
    const id="t"+uid();
    const color=PALETTE[state.tabList.length % PALETTE.length];
    const t={id,label:name,color,type:(type==="goal"?"goal":"task")};
    if(t.type==="goal") t.workDays=DEFAULT_WORK_DAYS.slice();
    state.tabList.push(t);
    state.tabs[id]=[];
    state.active=id;
    renderTabs(); applyAccent(); renderList(); renderGoalSettings(); updateFooter(); updatePlaceholder(); save();
  }
  function handleManageAction(id,act){
    const idx=state.tabList.findIndex(t=>t.id===id);
    if(idx<0) return;
    if(act==="up" && idx>0){
      const tmp=state.tabList[idx-1]; state.tabList[idx-1]=state.tabList[idx]; state.tabList[idx]=tmp;
    }else if(act==="down" && idx<state.tabList.length-1){
      const tmp=state.tabList[idx+1]; state.tabList[idx+1]=state.tabList[idx]; state.tabList[idx]=tmp;
    }else if(act==="rename"){
      const t=state.tabList[idx];
      const nn=prompt("Rename tab:",t.label);
      if(nn===null) return;
      const trimmed=nn.trim();
      if(trimmed) t.label=trimmed;
    }else if(act==="delete"){
      if(state.tabList.length<=1){ alert("You need at least one tab."); return; }
      const t=state.tabList[idx];
      const count=(state.tabs[t.id]||[]).length;
      const msg = count>0
        ? `Delete "${t.label}"? This removes its ${count} item${count===1?"":"s"} too. This can't be undone.`
        : `Delete "${t.label}"?`;
      if(!confirm(msg)) return;
      state.tabList.splice(idx,1);
      delete state.tabs[t.id];
      if(state.active===t.id) state.active=state.tabList[0].id;
    }else{
      return;
    }
    renderTabs(); renderList(); renderGoalSettings(); updateFooter(); updatePlaceholder(); applyAccent(); save();
    renderManageBody();
  }
  $("#manageClose").onclick=()=>manageScrim.classList.remove("show");
  manageScrim.onclick=e=>{ if(e.target===manageScrim) manageScrim.classList.remove("show"); };

  /* ---------- Work hours ---------- */
  const hoursScrim=$("#hoursScrim");
  const DAY_ABBR=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function renderHoursBody(){
    const body=$("#hoursBody");
    body.innerHTML=[0,1,2,3,4,5,6].map(d=>{
      const e=state.workHours[d];
      const on=!!e;
      const start=e?e.start:"09:00", end=e?e.end:"17:00";
      return `<div class="hours-row" data-d="${d}">
        <button type="button" class="hours-day-toggle${on?" on":""}" data-role="toggle">${DAY_ABBR[d]}</button>
        <input type="time" class="hours-time" data-role="start" value="${start}" ${on?"":"disabled"}>
        <span class="hours-sep">–</span>
        <input type="time" class="hours-time" data-role="end" value="${end}" ${on?"":"disabled"}>
      </div>`;
    }).join("");
    body.querySelectorAll(".hours-row").forEach(row=>{
      const d=parseInt(row.dataset.d,10);
      const toggleBtn=row.querySelector('[data-role="toggle"]');
      const startInp=row.querySelector('[data-role="start"]');
      const endInp=row.querySelector('[data-role="end"]');
      toggleBtn.onclick=()=>{
        if(state.workHours[d]) delete state.workHours[d];
        else state.workHours[d]={start:startInp.value||"09:00", end:endInp.value||"17:00"};
        renderHoursBody(); renderList(); save();
      };
      startInp.onchange=()=>{ if(state.workHours[d] && TIME_RE.test(startInp.value)){ state.workHours[d].start=startInp.value; renderList(); save(); } };
      endInp.onchange=()=>{ if(state.workHours[d] && TIME_RE.test(endInp.value)){ state.workHours[d].end=endInp.value; renderList(); save(); } };
    });
  }
  $("#openHoursBtn").onclick=()=>{ renderHoursBody(); hoursScrim.classList.add("show"); };
  $("#hoursClose").onclick=()=>hoursScrim.classList.remove("show");
  hoursScrim.onclick=e=>{ if(e.target===hoursScrim) hoursScrim.classList.remove("show"); };

  /* ---------- Goal tabs ---------- */
  function updatePlaceholder(){
    const t=activeTab();
    const isGoal = !!(t&&t.type==="goal");
    input.placeholder = isGoal ? "e.g. 20 cars delivered" : "Add a task…";
    const lbl=$("#addToggleLabel");
    if(lbl) lbl.textContent = isGoal ? `Add a goal · ${workDaysSummary(t.workDays)}` : "Add a task";
  }
  function updateFooter(){
    const t=activeTab();
    const dayBtn=$("#newDayBtn"), logBtn=$("#logBtn");
    if(t&&t.type==="goal"){
      dayBtn.textContent="Goal history";
      logBtn.style.display="none";
    }else{
      dayBtn.textContent="Start a new day";
      logBtn.style.display="";
    }
  }
  function workDaysSummary(workDays){
    const abbr=["Su","Mo","Tu","We","Th","Fr","Sa"];
    if(!workDays.length) return "None selected";
    if(workDays.length===7) return "Every day";
    const sorted=workDays.slice().sort((a,b)=>a-b);
    const contiguous=sorted.every((d,i)=>i===0||d===sorted[i-1]+1);
    return contiguous
      ? `${abbr[sorted[0]]}–${abbr[sorted[sorted.length-1]]}`
      : sorted.map(d=>abbr[d]).join(", ");
  }
  // The working-days picker shares its open/closed state with the add row
  // (addRowOpen, declared below) so one toggle shows or hides both together.
  function renderGoalSettings(){
    const daysEl=$("#gsDays");
    const t=activeTab();
    if(!t || t.type!=="goal"){
      daysEl.classList.remove("open");
      daysEl.innerHTML="";
      return;
    }
    daysEl.classList.toggle("open",addRowOpen);
    const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
    daysEl.innerHTML=days.map((d,i)=>
      `<button type="button" class="gs-day${t.workDays.includes(i)?" on":""}" data-d="${i}">${d}</button>`
    ).join("");
    daysEl.querySelectorAll(".gs-day").forEach(b=>{
      b.onclick=()=>{
        const d=parseInt(b.dataset.d,10);
        const idx=t.workDays.indexOf(d);
        if(idx>-1) t.workDays.splice(idx,1); else t.workDays.push(d);
        renderGoalSettings(); renderList(); updatePlaceholder(); save();
      };
    });
  }
  function monthKey(d){ return d.getFullYear()+"-"+d.getMonth(); }
  function monthLabel(mk){
    const parts=mk.split("-").map(Number);
    return new Date(parts[0],parts[1],1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  }
  function workingDaysLeft(date,workDays){
    if(!workDays.length) return 0;
    const y=date.getFullYear(),m=date.getMonth();
    const lastDate=new Date(y,m+1,0).getDate();
    let count=0;
    for(let d=date.getDate();d<=lastDate;d++){
      if(workDays.includes(new Date(y,m,d).getDay())) count++;
    }
    return count;
  }
  function checkGoalRollover(){
    const mk=monthKey(new Date());
    let changed=false;
    state.tabList.filter(t=>t.type==="goal").forEach(t=>{
      (state.tabs[t.id]||[]).forEach(g=>{
        if(g.monthKey!==mk){
          if(g.target>0){
            state.goalHistory.unshift({id:uid(),unit:g.unit,target:g.target,current:g.current,monthKey:g.monthKey,closedAt:Date.now(),tabId:t.id,tabLabel:t.label});
          }
          g.current=0;
          g.monthKey=mk;
          changed=true;
        }
      });
    });
    if(changed) save();
  }
  function fmtNum(n){
    return (Math.abs(n-Math.round(n))<0.001) ? String(Math.round(n)) : n.toFixed(1);
  }
  function parseGoalInput(v){
    const m=v.match(/^([0-9]+(?:\.[0-9]+)?)\s*(.*)$/);
    if(!m) return null;
    const target=parseFloat(m[1]);
    if(!(target>0)) return null;
    return {target, unit:m[2].trim()||"goal"};
  }
  function timeStrToMinutes(s){ const p=s.split(":"); return parseInt(p[0],10)*60+parseInt(p[1],10); }
  // Hours remaining in *today's* office-hours window, for pacing a daily goal
  // on a to-do. Returns null when today isn't a work day at all.
  function hoursLeftToday(workHours){
    const now=new Date();
    const entry=workHours[now.getDay()];
    if(!entry) return null;
    const startMin=timeStrToMinutes(entry.start), endMin=timeStrToMinutes(entry.end);
    if(endMin<=startMin) return null;
    const nowMin=now.getHours()*60+now.getMinutes();
    if(nowMin>=endMin) return 0;
    return (endMin-Math.max(nowMin,startMin))/60;
  }
  function goalBodyHtml(g,daysLeft){
    const remaining=Math.max(0,g.target-g.current);
    const achieved=g.target>0 && g.current>=g.target;
    const perDay=daysLeft>0 ? remaining/daysLeft : remaining;
    const pct=g.target>0 ? Math.min(100,(g.current/g.target)*100) : 0;
    const daysLabel = daysLeft>0 ? `${daysLeft} workday${daysLeft===1?"":"s"} left` : "no workdays left";
    return `<div class="body goal-body">
      <div class="goal-top">
        <span class="goal-unit">${escapeHtml(g.unit)}</span>
        <button class="goal-edit" title="Edit target" aria-label="Edit goal target">✎</button>
      </div>
      ${achieved
        ? `<div class="goal-done">🎉 Goal met</div>`
        : `<div class="goal-pace-wrap"><span class="goal-pace-num">${fmtNum(perDay)}</span><span class="goal-pace-cap">per day</span></div>`}
      <div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
      <div class="goal-stats"><b>${fmtNum(g.current)}</b>/${fmtNum(g.target)} · ${fmtNum(remaining)} left · ${daysLabel}</div>
      <div class="goal-current-row">
        <span>Current</span>
        <button class="goal-cur-btn" data-role="cur" type="button">${fmtNum(g.current)}</button>
      </div>
    </div>`;
  }
  function startEditCurrent(goalId,btnEl){
    const g=(state.tabs[state.active]||[]).find(x=>x.id===goalId);
    if(!g) return;
    const inp=document.createElement("input");
    inp.type="number"; inp.inputMode="decimal"; inp.className="goal-cur-input";
    inp.value=g.current;
    btnEl.replaceWith(inp);
    inp.focus(); inp.select();
    let done=false;
    const commit=()=>{
      if(done) return; done=true;
      const v=parseFloat(inp.value);
      g.current=isNaN(v)?g.current:v;
      renderList(); save();
    };
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter") commit();
      else if(e.key==="Escape"){ done=true; renderList(); }
    });
    inp.addEventListener("blur",commit);
  }
  function startEditGoal(goalId){

  /* ---------- Daily goal attached to a to-do (task tabs only) ---------- */
  function taskBodyHtml(it){
    const g=it.dailyGoal;
    if(!g || !(g.target>0)){
      return `<div class="body task-body">
        <span class="task-text">${escapeHtml(it.text)}</span>

    const remaining=Math.max(0,g.target-g.current);

    const hrsLeft=hoursLeftToday(state.workHours);
    let paceHtml;
    if(achieved){
      paceHtml=`<div class="daily-done">🎉 Today's goal met</div>`;
    }else if(hrsLeft===null){
      paceHtml=`<div class="daily-pace-note">Not a work day today</div>`;
    }else if(hrsLeft<=0){
      paceHtml=`<div class="daily-pace-note">Office hours are over for today</div>`;
    }else{
      paceHtml=`<div class="daily-pace-row"><b>${fmtNum(remaining/hrsLeft)}</b>/hr · ${fmtNum(hrsLeft)} hr${hrsLeft===1?"":"s"} left today</div>`;
    }
    const pct=g.target>0 ? Math.min(100,(g.current/g.target)*100) : 0;
    return `<div class="body">
      <div class="task-goal-text">${escapeHtml(it.text)}</div>
      <div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
      <div class="daily-stats"><b>${fmtNum(g.current)}</b>/${fmtNum(g.target)} ${escapeHtml(g.unit)} · ${fmtNum(remaining)} left</div>
      ${paceHtml}
      <div class="goal-current-row">
        <span>Current</span>
        <button class="goal-cur-btn" data-role="dailyCur" type="button">${fmtNum(g.current)}</button>
        <button class="daily-goal-edit" data-role="dailyEdit" type="button" title="Edit today's goal" aria-label="Edit today's goal">✎</button>
      </div>

  function startEditDailyGoal(itemId){

  function openGoalHistory(){

  function renderGoalHistBody(){

  function renderList(){
    const t=activeTab();

        <button class="pop" aria-label="${isGoals?"Delete goal":"Complete and pop task"}"><span class="ring">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>
        </span></button>`;
      el.querySelector(".pop").onclick=()=>popTask(it.id,el);

  /* ---------- add ---------- */
  const input=$("#taskInput");
  function addTask(){
    const v=input.value.trim();
    if(!v) return;
    const t=activeTab();
    if(!t) return;
    if(t.type==="goal"){
      const parsed=parseGoalInput(v);
      if(!parsed){ alert('Start with a number, e.g. "20 cars delivered".'); return; }
      (state.tabs[t.id]=state.tabs[t.id]||[]).push({id:uid(),target:parsed.target,unit:parsed.unit,current:0,createdAt:Date.now(),monthKey:monthKey(new Date())});
    }else{
      (state.tabs[t.id]=state.tabs[t.id]||[]).push({id:uid(),text:v,createdAt:Date.now()});
    }
    input.value="";
    renderTabs(); renderList(); save();
  }
  $("#addBtn").onclick=addTask;
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); });

  let addRowOpen=true;
  const addToggleBtn=$("#addToggle"), addRowEl=$("#addRow");
  function setAddOpen(open){
    addRowOpen=open;
    addToggleBtn.classList.toggle("open",open);
    addRowEl.classList.toggle("open",open);
  }

  /* ---------- pop / complete ---------- */
  function popTask(id,el){
    if(el.classList.contains("popping")) return;
    burst(el);
    el.classList.add("popping");
    const done=()=>{
      const arr=state.tabs[state.active]||[];
      const idx=arr.findIndex(x=>x.id===id);
      if(idx>-1) arr.splice(idx,1);
      renderTabs(); renderList(); save();
    };
    let called=false;
    el.addEventListener("animationend",()=>{if(!called){called=true;done();}},{once:true});
    setTimeout(()=>{if(!called){called=true;done();}},500);
  }
  function burst(el){
    const r=el.getBoundingClientRect();
    const cx=r.right-30, cy=r.top+r.height/2;
    const c=tabColor(state.active);
    const cols=[c,"#ffffff",hexA(c,.7)];
    for(let i=0;i<9;i++){
      const s=document.createElement("div");
      s.className="spark";
      const ang=(Math.PI*2*i)/9+Math.random()*0.5;
      const dist=32+Math.random()*26;
      s.style.left=cx+"px"; s.style.top=cy+"px";
      s.style.background=cols[i%cols.length];
      s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
      s.style.setProperty("--dy",Math.sin(ang)*dist+"px");
      s.style.animation="fly .5s cubic-bezier(.2,.7,.3,1) forwards";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),560);
    }
  }

  /* ---------- drag reorder (pointer events: mouse + touch) ---------- */
  let drag=null;
  const GAP=12;
  function startDrag(e,el){
    e.preventDefault();
    const nodes=[...listEl.querySelectorAll(".bubble")];
    const from=nodes.indexOf(el);
    drag={
      el,from,to:from,startY:e.clientY,
      height:el.getBoundingClientRect().height+GAP,
      nodes:nodes.map(n=>({el:n,mid:n.getBoundingClientRect().top+n.getBoundingClientRect().height/2}))
    };
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    el.addEventListener("pointermove",onDragMove);
    el.addEventListener("pointerup",endDrag);
    el.addEventListener("pointercancel",endDrag);
  }
  function onDragMove(e){
    if(!drag) return;
    const dy=e.clientY-drag.startY;
    drag.el.style.transform=`translateY(${dy}px) scale(1.02)`;
    const center=drag.nodes[drag.from].mid+dy;
    let to=0;
    for(let i=0;i<drag.nodes.length;i++){
      if(i===drag.from) continue;
      if(center>drag.nodes[i].mid) to++;
    }
    drag.to=to;
    drag.nodes.forEach((n,i)=>{
      if(n.el===drag.el) return;
      let shift=0;
      if(drag.from<drag.to && i>drag.from && i<=drag.to) shift=-drag.height;
      else if(drag.from>drag.to && i<drag.from && i>=drag.to) shift=drag.height;
      n.el.style.transform=shift?`translateY(${shift}px)`:"";
    });
  }
  function endDrag(e){
    if(!drag) return;
    const {el,from,to}=drag;
    el.releasePointerCapture&&el.releasePointerCapture(e.pointerId);
    el.removeEventListener("pointermove",onDragMove);
    el.removeEventListener("pointerup",endDrag);
    el.removeEventListener("pointercancel",endDrag);
    drag.nodes.forEach(n=>n.el.style.transform="");
    el.classList.remove("dragging");
    drag=null;
    if(to!==from){
      const arr=state.tabs[state.active]||[];
      const [moved]=arr.splice(from,1);
      arr.splice(to,0,moved);
      renderList(); save();
    }
  }

  /* ---------- New Day review (task-type tabs only) ---------- */
  const reviewScrim=$("#reviewScrim");
  const reviewSheet=$("#reviewSheet");
  let review=null;
  $("#newDayBtn").onclick=()=>{
    const t=activeTab();
    if(t && t.type==="goal"){ openGoalHistory(); return; }
    const items=state.tabs[state.active]||[];
    if(!items.length){ flashEmptyDay(); return; }
    backup(); // keep a copy of the pre-review board
    lastSnapshot={tab:state.active,items:items.slice(),delegated:state.delegated.slice()};
    review={queue:items.slice(),idx:0,keep:[],dropped:0,delegated:0};
    reviewScrim.classList.add("show");
    renderReview();
  };
  function flashEmptyDay(){
    reviewSheet.innerHTML=`
      <div class="sheet-head"><h2>All clear</h2>
      <p>This tab is already empty — nothing to review. Start adding tasks for the day.</p></div>
      <div class="sheet-foot"><button class="btn btn-solid" id="fe">Got it</button></div>`;
    reviewScrim.classList.add("show");
    $("#fe").onclick=closeReview;
  }
  function renderReview(){
    const tabLbl=tabLabel(state.active);
    if(review.idx>=review.queue.length){
      // apply
      state.tabs[state.active]=review.keep;
      renderTabs(); renderList(); renderLogCount(); save();
      reviewSheet.innerHTML=`
        <div class="sheet-head"><h2>${escapeHtml(tabLbl)} — fresh start</h2>
        <p>Kept ${review.keep.length}, cleared ${review.dropped}, delegated ${review.delegated}. Have a good one.</p></div>
        <div class="sheet-foot">
          <button class="btn btn-ghost" id="rundo">Undo review</button>
          <button class="btn btn-solid" id="rdone">Done</button>
        </div>`;
      $("#rdone").onclick=closeReview;
      $("#rundo").onclick=undoReview;
      review=null;
      return;
    }
    const t=review.queue[review.idx];
    reviewSheet.innerHTML=`
      <div class="sheet-head">
        <h2>New day · ${escapeHtml(tabLbl)}</h2>
        <p>Go through each task and decide where it stands today.</p>
      </div>
      <div class="review-card" style="--tab-c:${tabColor(state.active)}">
        <div class="task">${escapeHtml(t.text)}</div>
      </div>
      <div class="review-actions">
        <button class="ra keep" data-a="keep"><span class="ic">✓</span><span>Keep<small>Stays on today's list</small></span></button>
        <button class="ra drop" data-a="drop"><span class="ic">○</span><span>Not a priority<small>Remove it for good</small></span></button>
        <button class="ra deleg" data-a="deleg"><span class="ic">➜</span><span>Delegated<small>Hand off — saved to the log</small></span></button>
      </div>
      <div class="review-progress">${review.idx+1} of ${review.queue.length}</div>`;
    reviewSheet.querySelectorAll(".ra").forEach(b=>{
      b.onclick=()=>decide(b.dataset.a);
    });
  }
  function decide(action){
    const t=review.queue[review.idx];
    if(action==="keep"){
      if(t.dailyGoal) t.dailyGoal.current=0; // fresh day, fresh tally
      review.keep.push(t);
    }
    else if(action==="drop") review.dropped++;
    else if(action==="deleg"){
      review.delegated++;
      state.delegated.unshift({id:uid(),text:t.text,tab:state.active,tabLabel:tabLabel(state.active),at:Date.now()});
    }
    review.idx++;
    renderReview();
  }
  function undoReview(){
    if(!lastSnapshot) return closeReview();
    state.tabs[lastSnapshot.tab]=lastSnapshot.items.slice();
    state.delegated=lastSnapshot.delegated.slice();
    lastSnapshot=null;
    renderTabs(); renderList(); renderLogCount(); save();
    closeReview();
  }
  function closeReview(){ reviewScrim.classList.remove("show"); review=null; }
  reviewScrim.onclick=e=>{ if(e.target===reviewScrim && !review) closeReview(); };

  /* ---------- Delegated log ---------- */

  /* ---------- export / import (manual cross-device transfer) ---------- */
  $("#exportBtn").onclick=()=>{
    const payload=JSON.stringify({tabList:state.tabList,tabs:state.tabs,delegated:state.delegated,goalHistory:state.goalHistory,workHours:state.workHours,exportedAt:Date.now()},null,2);
    const blob=new Blob([payload],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url; a.download=`poplist-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const p=JSON.parse(reader.result);
        const s=buildStateFrom(p);
        if(!s) throw new Error("bad file");
        applyState(s);
        renderTabs(); renderList(); renderLogCount(); renderGoalSettings(); updateFooter(); updatePlaceholder(); applyAccent(); save(); backup();
        alert("Backup loaded.");
      }catch(err){ alert("That file doesn't look like a Poplist backup."); }
      e.target.value="";
    };
    reader.readAsText(file);
  });

  /* ---------- init ---------- */
  // The working day runs 5am → 5am, so anything before 5am still reads as
  // "yesterday" rather than flipping over on you at midnight.
  function dayStamp(d){
    const x=new Date(d.getTime());
    if(x.getHours()<DAY_START_HOUR) x.setDate(x.getDate()-1);
    return x;
  }
  function setToday(){
    const d=dayStamp(new Date());
    const label=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    const early=new Date().getHours()<DAY_START_HOUR;
    $("#today").textContent = early ? label+" (still, until 5am)" : label;
  }
  setInterval(setToday,60000);
  // Daily-goal pacing depends on the clock, so refresh it once a minute.
  setInterval(()=>{ const t=activeTab(); if(t && t.type!=="goal") renderList(); },60000);

  function renderWarn(){
    const w=$("#warn");
    let html="";
    if(storageOK===false){
      html+=`<div class="notice bad"><span>⚠︎</span><span><b>Saving is unavailable here</b>
        This browser is blocking local storage (common in private/incognito mode), so your list
        only lives in this tab and won't survive a reload. Try a normal browser tab, or opened inside Claude.</span></div>`;
    }
    if(recovered){
      html+=`<div class="notice good"><span>↺</span><span><b>Restored from backup</b>
        The main copy came back empty, so your last saved list was recovered.</span>
        <button class="x" id="warnX">×</button></div>`;
    }
    w.innerHTML=html;
    const x=$("#warnX");
    if(x) x.onclick=()=>{ recovered=false; renderWarn(); };
  }

  (async function init(){
    setToday();
    await verifyStorage();
    await load();
    checkGoalRollover();
    applyAccent();
    renderTabs();
    renderList();
    renderLogCount();
    renderGoalSettings();
    updateFooter();
    updatePlaceholder();
    renderWarn();
    if(!isEmpty(state)) backup();
  })();
})();
</script>
</body>
</html>
